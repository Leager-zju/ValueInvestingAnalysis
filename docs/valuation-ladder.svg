<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="五档估值刻度示意图">
  <title>五档估值刻度</title>
  <rect x="0" y="0" width="900" height="230" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="40" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#0f172a">五档估值刻度</text>
  <text x="40" y="61" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">价格从左到右升高 · 四个锚必须严格递增</text>

  <text x="470" y="78" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">现价</text>
  <polygon points="463,81 477,81 470,89" fill="#0f172a"/>

  <clipPath id="bar-clip">
    <rect x="40" y="90" width="820" height="44" rx="8"/>
  </clipPath>
  <g clip-path="url(#bar-clip)">
    <rect x="40"  y="90" width="164" height="44" fill="#1e3a8a"/>
    <rect x="204" y="90" width="164" height="44" fill="#3b82f6"/>
    <rect x="368" y="90" width="164" height="44" fill="#94a3b8"/>
    <rect x="532" y="90" width="164" height="44" fill="#f59e0b"/>
    <rect x="696" y="90" width="164" height="44" fill="#991b1b"/>
  </g>
  <g font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <text x="122" y="117" fill="#ffffff">深度低估</text>
    <text x="286" y="117" fill="#ffffff">低估</text>
    <text x="450" y="117" fill="#ffffff">合理</text>
    <text x="614" y="117" fill="#78350f">偏贵</text>
    <text x="778" y="117" fill="#ffffff">估值透支</text>
  </g>

  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="204" y1="134" x2="204" y2="160"/>
    <line x1="368" y1="134" x2="368" y2="160"/>
    <line x1="532" y1="134" x2="532" y2="160"/>
    <line x1="696" y1="134" x2="696" y2="160"/>
  </g>
  <g font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">
    <text x="204" y="176">深度价值线</text>
    <text x="368" y="176">底仓线</text>
    <text x="532" y="176">合理上沿</text>
    <text x="696" y="176">透支线</text>
  </g>

  <line x1="40" y1="193" x2="860" y2="193" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="213" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#64748b">买入侧：期权价值打折计入　·　卖出侧：全额计入　·　只有基本面恶化或估值透支才减仓</text>
</svg>
